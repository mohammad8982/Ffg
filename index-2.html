const URL_='https://vzjoefmabbhizicmvnbd.supabase.co',KEY='sb_publishable_GmF2bct7pbiH6uXGKXMBrw_3X_iHBk0';const sb=supabase.createClient(URL_,KEY,{auth:{persistSession:true,autoRefreshToken:true}});const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>new Intl.NumberFormat('fa-IR').format(Number(v||0));const today=()=>new Date().toISOString().slice(0,10);
let S={session:null,profile:null,settings:null,days:[],products:[],reservations:[],orders:[],messages:[],receipts:[],tab:'overview',date:null};
function toast(x,good=true){let t=$('#toast');t.textContent=x;t.style.background=good?'#111827':'#991b1b';t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),3500)}function modal(t,b){$('#modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h3>${esc(t)}</h3><button class="ghost" onclick="closeModal()">✕</button></div>${b}</div>`;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}
function status(s){let m={pending:['در انتظار','warnb'],paid:['پرداخت‌شده',''],approved:['تأییدشده','okb'],rejected:['ردشده','badb'],done:['تکمیل‌شده','okb'],open:['باز',''],closed:['بسته','badb'],free:['آزاد','okb'],booked:['رزروشده','badb']};let x=m[s]||[s||'نامشخص',''];return `<span class="badge ${x[1]}">${esc(x[0])}</span>`}
async function settings(){let r=await sb.from('site_settings').select('*').order('id').limit(1).maybeSingle();if(!r.error)S.settings=r.data||null}async function publicData(){await settings();let [d,p]=await Promise.all([sb.from('reservation_days').select('*').order('reservation_date'),sb.from('coin_products').select('*').eq('is_active',true).order('sort_order')]);S.days=d.data||[];S.products=p.data||[]}
async function userData(){if(!S.session)return;let u=S.session.user;let p=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();S.profile=p.data||{id:u.id,full_name:u.user_metadata?.full_name||'',username:'',phone:''};let [r,o,m]=await Promise.all([sb.from('reservations').select('*').eq('user_id',u.id).order('created_at',{ascending:false}),sb.from('coin_orders').select('*').eq('user_id',u.id).order('created_at',{ascending:false}),sb.from('support_messages').select('*').eq('user_id',u.id).order('created_at',{ascending:false})]);S.reservations=r.data||[];S.orders=o.data||[];S.messages=m.data||[]}
function adminRole(){let r=String(S.profile?.role||'').toLowerCase();return r==='admin'||r==='super_admin'||r==='owner'||r==='administrator'||r.includes('admin')}
function head(){let s=S.settings||{};return `<header class="top"><div class="wrap nav"><button class="brand" onclick="home()">${s.logo_url?`<img src="${esc(s.logo_url)}">`:'<span class="logo">◆</span>'}<span>${esc(s.site_name||'سامانه خدمات')}</span></button><div class="links"><button onclick="home()">خانه</button><button onclick="reserve()">رزرو</button><button onclick="products()">محصولات</button><button onclick="support()">پشتیبانی</button>${S.session?'<button class="btn small" onclick="dashboard()">حساب من</button>':'<button class="btn small" onclick="auth()">ورود</button>'}</div><button class="ghost mobile" onclick="document.querySelector('.side')?.classList.toggle('open')">☰</button></div></header>`}
function home(){let s=S.settings||{};$('#app').innerHTML=head()+`<main><section class="wrap hero"><div><span class="badge">سامانه آنلاین</span><h1>${esc(s.site_title||'رزرو و خدمات حرفه‌ای')}</h1><p class="muted">${esc(s.site_description||'رزرو، خرید، ارسال رسید و پیگیری درخواست‌ها در یک سامانه واقعی و متصل به دیتابیس.')}</p><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn" onclick="reserve()">شروع رزرو</button><button class="btn secondary" onclick="products()">محصولات</button></div></div><div class="card"><h3>دسترسی سریع</h3><div class="grid g2"><button class="card" onclick="reserve()">📅<br><b>رزرو آنلاین</b></button><button class="card" onclick="products()">🪙<br><b>محصولات</b></button><button class="card" onclick="dashboard()">👤<br><b>حساب من</b></button><button class="card" onclick="support()">💬<br><b>پشتیبانی</b></button></div></div></section><section class="wrap section"><div class="title"><h2>محصولات فعال</h2><button class="btn secondary small" onclick="products()">همه محصولات</button></div><div class="grid g3">${S.products.slice(0,3).map(cardProduct).join('')||'<div class="card">محصولی ثبت نشده.</div>'}</div></section></main>`}
function cardProduct(p){return `<div class="card">${p.image_url?`<img class="preview" style="width:100%;height:180px;object-fit:cover" src="${esc(p.image_url)}">`:'<div style="height:180px;display:grid;place-items:center;font-size:55px;background:#f8fafc;border-radius:14px">🪙</div>'}<h3>${esc(p.name)}</h3><p class="muted">${esc(p.description||'')}</p><div class="title"><b>${num(p.price)} ${esc(p.currency||'تومان')}</b><button class="btn small" onclick="buy('${p.id}')">خرید</button></div></div>`}
function auth(){modal('ورود / ثبت‌نام',`<form class="form" onsubmit="event.preventDefault();login()"><label>ایمیل</label><input id="email" type="email" required><label>رمز عبور</label><input id="pass" type="password" required><button class="btn">ورود</button><button type="button" class="btn secondary" onclick="register()">ثبت‌نام حساب جدید</button></form>`)}async function login(){let r=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});if(r.error)return toast(r.error.message,false);closeModal();await boot();toast('ورود موفق بود')}async function register(){let e=$('#email').value.trim(),p=$('#pass').value;let r=await sb.auth.signUp({email:e,password:p});if(r.error)return toast(r.error.message,false);if(r.data.user)await sb.from('profiles').upsert({id:r.data.user.id,username:e.split('@')[0]},{onConflict:'id'});toast(r.data.session?'ثبت‌نام انجام شد':'ثبت‌نام انجام شد؛ در صورت فعال بودن تأیید ایمیل، ایمیل را تأیید کن');}
async function out(){await sb.auth.signOut();S.session=null;S.profile=null;home()}function dashboard(){if(!S.session)return auth();$('#app').innerHTML=head()+`<main class="wrap section"><div class="title"><div><h2>حساب من</h2><span class="muted">${esc(S.profile?.full_name||S.session.user.email)}</span></div><div>${adminRole()?'<button class="btn" onclick="admin()">پنل مدیریت</button> ':''}<button class="btn bad" onclick="out()">خروج</button></div></div><div class="grid g3"><div class="card stat">رزروها<b>${S.reservations.length}</b></div><div class="card stat">خریدها<b>${S.orders.length}</b></div><div class="card stat">پیام‌های پشتیبانی<b>${S.messages.length}</b></div></div><section class="section"><h3>رزروهای من</h3><div class="table">${userTable()}</div></section></main>`}function userTable(){return `<table><thead><tr><th>تاریخ</th><th>مبلغ</th><th>وضعیت</th><th>رسید</th></tr></thead><tbody>${S.reservations.map(x=>`<tr><td>${esc(x.reservation_date)}</td><td>${num(x.amount)}</td><td>${status(x.status)}</td><td>${x.receipt_url?`<a class="btn secondary small" href="${esc(x.receipt_url)}" target="_blank">مشاهده</a>`:'—'}</td></tr>`).join('')||'<tr><td colspan="4">موردی نیست.</td></tr>'}</tbody></table>`}
function reserve(){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,c='';for(let i=0;i<first;i++)c+='<div></div>';for(let d=1;d<=new Date(y,m+1,0).getDate();d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,r=S.days.find(x=>x.reservation_date===ds),free=r&&r.status!=='booked'&&r.status!=='closed'&&ds>=today();c+=`<button class="day ${free?'free':'booked'} ${S.date===ds?'sel':''}" ${free?`onclick="pick('${ds}')"`:''}><b>${d}</b><small>${r?num(r.price):'—'}</small></button>`}$('#app').innerHTML=head()+`<main class="wrap section"><div class="title"><div><h2>رزرو آنلاین</h2><p class="muted">روز آزاد را انتخاب کن.</p></div></div><div class="grid g2"><div class="card"><div class="calendar">${['ش','ی','د','س','چ','پ','ج'].map(x=>`<div class="calhead">${x}</div>`).join('')}${c}</div></div><div class="card">${S.date?reserveForm(S.date):'<div class="muted">یک روز آزاد را انتخاب کن.</div>'}</div></div></main>`}function pick(d){S.date=d;reserve()}
function fileBox(id){return `<div class="upload"><input id="${id}" type="file" accept="image/*" onchange="prev('${id}')"><img id="${id}p" class="preview" style="display:none"></div>`}function prev(id){let f=$('#'+id).files[0],i=$('#'+id+'p');if(f){i.src=URL.createObjectURL(f);i.style.display='block'}}async function imageData(file,max=1400){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let w=im.width,h=im.height;if(Math.max(w,h)>max){let k=max/Math.max(w,h);w*=k;h*=k}let c=document.createElement('canvas');c.width=Math.round(w);c.height=Math.round(h);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}async function upload(file,folder){if(!file)return null;try{let data=await imageData(file),blob=await(await fetch(data)).blob(),path=`${folder}/${crypto.randomUUID()}.jpg`,u=await sb.storage.from('site-assets').upload(path,blob,{contentType:'image/jpeg'});if(!u.error)return sb.storage.from('site-assets').getPublicUrl(path).data.publicUrl}catch(e){}return imageData(file)}
function reserveForm(ds){let r=S.days.find(x=>x.reservation_date===ds)||{price:S.settings?.reservation_price||0};if(!S.session)return `<h3>رزرو ${esc(ds)}</h3><p>${num(r.price)} ${esc(S.settings?.currency||'تومان')}</p><button class="btn" onclick="auth()">ورود / ثبت‌نام</button>`;return `<h3>ثبت رزرو</h3><p>${esc(ds)} — ${num(r.price)} ${esc(S.settings?.currency||'تومان')}</p><form class="form" onsubmit="event.preventDefault();saveReservation('${ds}',${Number(r.price)||0})"><label>نام مشتری</label><input id="rn" value="${esc(S.profile?.full_name||'')}" required><label>نام کاربری تلگرام</label><input id="rt"><label>Telegram ID</label><input id="rid"><label>شماره تماس</label><input id="rp" value="${esc(S.profile?.phone||'')}"><label>توضیحات</label><textarea id="rd"></textarea><label>تصویر رسید</label>${fileBox('rr')}<button class="btn">ثبت درخواست</button></form>`}async function saveReservation(ds,amount){let f=$('#rr').files[0],url=await upload(f,'receipts');let r=await sb.from('reservations').insert({user_id:S.session.user.id,reservation_date:ds,customer_name:$('#rn').value,telegram_username:$('#rt').value,telegram_id:$('#rid').value,phone:$('#rp').value,description:$('#rd').value,receipt_url:url,amount,status:'pending'});if(r.error)return toast(r.error.message,false);toast('رزرو ثبت شد');await userData();dashboard()}

function support(){$('#app').innerHTML=head()+`<main class="wrap section"><div class="grid g2"><div class="card"><h2>پشتیبانی</h2>${S.session?`<form class="form" onsubmit="event.preventDefault();sendSupport()"><textarea id="sm" required placeholder="پیام خود را بنویس..."></textarea><button class="btn">ارسال</button></form>`:'<button class="btn" onclick="auth()">ورود برای ارسال پیام</button>'}</div><div class="card"><h3>پشتیبانی مستقیم</h3><p class="muted">${esc(S.settings?.support_username||'در تنظیمات ثبت نشده')}</p></div></div></main>`}async function sendSupport(){let r=await sb.from('support_messages').insert({user_id:S.session.user.id,name:S.profile?.full_name||'',telegram_username:S.profile?.username||'',message:$('#sm').value,status:'open'});if(r.error)return toast(r.error.message,false);toast('پیام ارسال شد');await userData();support()}
async function admin(){if(!S.session)return auth();await userData();if(!adminRole())return toast('این حساب مدیر نیست.',false);await adminLoad();adminRender()}async function adminLoad(){let [d,r,o,p,m,pr,s]=await Promise.all([sb.from('reservation_days').select('*').order('reservation_date',{ascending:false}),sb.from('reservations').select('*,profiles(full_name,username)').order('created_at',{ascending:false}),sb.from('coin_orders').select('*').order('created_at',{ascending:false}),sb.from('coin_products').select('*').order('sort_order'),sb.from('support_messages').select('*').order('created_at',{ascending:false}),sb.from('payment_receipts').select('*').order('created_at',{ascending:false}),sb.from('site_settings').select('*').order('id').limit(1).maybeSingle()]);S.days=d.data||[];S.reservations=r.data||[];S.orders=o.data||[];S.products=p.data||[];S.messages=m.data||[];S.receipts=pr.data||[];if(!s.error)S.settings=s.data||S.settings}
function adminRender(){let tabs=[['overview','داشبورد'],['reservations','رزروها'],['orders','سفارش‌ها'],['products','محصولات'],['days','تقویم'],['support','پشتیبانی'],['receipts','رسیدها'],['settings','تنظیمات']];$('#app').innerHTML=head()+`<div class="admin"><aside class="side">${tabs.map(t=>`<button class="${S.tab===t[0]?'active':''}" onclick="S.tab='${t[0]}';adminRender()">${t[1]}</button>`).join('')}<button onclick="dashboard()">بازگشت</button></aside><section class="adminmain"><div class="title"><h2>پنل مدیریت</h2><button class="btn small" onclick="adminLoad().then(adminRender)">بروزرسانی</button></div>${adminContent()}</section></div>`}function adminContent(){return ({overview:aOverview,reservations:aReservations,orders:aOrders,products:aProducts,days:aDays,support:aSupport,receipts:aReceipts,settings:aSettings}[S.tab]||aOverview)()}
function aOverview(){let rev=[...S.reservations,...S.orders].filter(x=>['paid','approved','done'].includes(x.status)).reduce((a,x)=>a+Number(x.amount||0),0);return `<div class="grid g4"><div class="card stat">رزروها<b>${S.reservations.length}</b></div><div class="card stat">سفارش‌ها<b>${S.orders.length}</b></div><div class="card stat">در انتظار<b>${[...S.reservations,...S.orders].filter(x=>x.status==='pending').length}</b></div><div class="card stat">تأییدشده<b>${num(rev)}</b></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><h3>آخرین رزروها</h3>${S.reservations.slice(0,6).map(x=>`<p>${esc(x.customer_name)} — ${status(x.status)}</p>`).join('')||'—'}</div><div class="card"><h3>آخرین سفارش‌ها</h3>${S.orders.slice(0,6).map(x=>`<p>${esc(x.product_name)} — ${status(x.status)}</p>`).join('')||'—'}</div></div>`}
function aReservations(){return `<div class="title"><h2>رزروها</h2><button class="btn small" onclick="csvRes()">CSV</button></div><div class="table"><table><tr><th>تاریخ</th><th>مشتری</th><th>مبلغ</th><th>وضعیت</th><th>رسید</th><th>عملیات</th></tr>${S.reservations.map(x=>`<tr><td>${esc(x.reservation_date)}</td><td>${esc(x.customer_name||x.profiles?.full_name)}</td><td>${num(x.amount)}</td><td>${status(x.status)}</td><td>${x.receipt_url?`<a class="btn secondary small" target="_blank" href="${esc(x.receipt_url)}">تصویر</a>`:'—'}</td><td><button class="btn ok small" onclick="setRes('${x.id}','approved')">تأیید</button> <button class="btn bad small" onclick="setRes('${x.id}','rejected')">رد</button></td></tr>`).join('')}</table></div>`}async function setRes(id,statusv){let r=await sb.from('reservations').update({status:statusv,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return toast(r.error.message,false);await log('reservation_status',id,{status:statusv});await adminLoad();adminRender();toast('انجام شد')}
function aOrders(){return `<div class="title"><h2>سفارش‌ها</h2><button class="btn small" onclick="csvOrd()">CSV</button></div><div class="table"><table><tr><th>محصول</th><th>مشتری</th><th>مبلغ</th><th>وضعیت</th><th>رسید</th><th>عملیات</th></tr>${S.orders.map(x=>`<tr><td>${esc(x.product_name)}</td><td>${esc(x.customer_name)}</td><td>${num(x.amount)}</td><td>${status(x.status)}</td><td>${x.receipt_url?`<a class="btn secondary small" target="_blank" href="${esc(x.receipt_url)}">تصویر</a>`:'—'}</td><td><button class="btn ok small" onclick="setOrd('${x.id}','approved')">تأیید</button> <button class="btn bad small" onclick="setOrd('${x.id}','rejected')">رد</button> <button class="btn small" onclick="setOrd('${x.id}','done')">تکمیل</button></td></tr>`).join('')}</table></div>`}async function setOrd(id,statusv){let r=await sb.from('coin_orders').update({status:statusv,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return toast(r.error.message,false);await log('coin_order_status',id,{status:statusv});await adminLoad();adminRender();toast('انجام شد')}

function aDays(){return `<div class="title"><h2>تقویم</h2><button class="btn" onclick="dayForm()">+ روز</button></div><div class="table"><table><tr><th>تاریخ</th><th>قیمت</th><th>وضعیت</th><th>یادداشت</th><th></th></tr>${S.days.map(x=>`<tr><td>${esc(x.reservation_date)}</td><td>${num(x.price)}</td><td>${status(x.status)}</td><td>${esc(x.note||'')}</td><td><button class="btn small" onclick="dayForm('${x.id}')">ویرایش</button></td></tr>`).join('')}</table></div>`}function dayForm(id){let x=S.days.find(a=>a.id===id)||{reservation_date:today(),price:S.settings?.reservation_price||0,status:'free',note:''};modal(id?'ویرایش روز':'روز جدید',`<form class="form" onsubmit="event.preventDefault();saveDay('${id||''}')"><label>تاریخ</label><input id="dd" type="date" value="${esc(x.reservation_date)}"><label>قیمت</label><input id="dp" type="number" value="${x.price||0}"><label>وضعیت</label><select id="ds"><option value="free">آزاد</option><option value="booked">رزروشده</option><option value="closed">بسته</option></select><label>یادداشت</label><textarea id="dn">${esc(x.note||'')}</textarea><button class="btn">ذخیره</button></form>`);$('#ds').value=x.status||'free'}async function saveDay(id){let q={reservation_date:$('#dd').value,price:Number($('#dp').value||0),status:$('#ds').value,note:$('#dn').value,updated_at:new Date().toISOString()},r=id?await sb.from('reservation_days').update(q).eq('id',id):await sb.from('reservation_days').insert(q);if(r.error)return toast(r.error.message,false);closeModal();await adminLoad();adminRender();toast('روز ذخیره شد')}

function aSettings(){let s=S.settings||{};return `<h2>تنظیمات</h2><form class="card form" onsubmit="event.preventDefault();saveSettings()"><label>نام سایت</label><input id="sn" value="${esc(s.site_name||'')}"><label>عنوان</label><input id="st" value="${esc(s.site_title||'')}"><label>توضیحات</label><textarea id="sd">${esc(s.site_description||'')}</textarea><label>شماره کارت</label><input id="sc" value="${esc(s.card_number||'')}"><label>صاحب کارت</label><input id="so" value="${esc(s.card_owner||'')}"><label>تلگرام</label><input id="tg" value="${esc(s.telegram_id||'')}"><label>پشتیبانی</label><input id="su" value="${esc(s.support_username||'')}"><label>قیمت پایه رزرو</label><input id="rp" type="number" value="${s.reservation_price||0}"><label>واحد پول</label><input id="cu" value="${esc(s.currency||'تومان')}"><label>لوگو</label>${fileBox('logo')}<button class="btn">ذخیره</button></form>`}async function saveSettings(){let f=$('#logo').files[0],logo=S.settings?.logo_url||null;if(f)logo=await upload(f,'branding');let q={id:S.settings?.id||1,site_name:$('#sn').value,site_title:$('#st').value,site_description:$('#sd').value,card_number:$('#sc').value,card_owner:$('#so').value,telegram_id:$('#tg').value,support_username:$('#su').value,reservation_price:Number($('#rp').value||0),currency:$('#cu').value,logo_url:logo,updated_at:new Date().toISOString()};let r=await sb.from('site_settings').upsert(q,{onConflict:'id'});if(r.error)return toast(r.error.message,false);await settings();home();toast('تنظیمات ذخیره شد')}
function adminContent(){return ({overview:aOverview,reservations:aReservations,orders:aOrders,products:aProducts,days:aDays,support:aSupport,receipts:aReceipts,settings:aSettings}[S.tab]||aOverview)()}function adminRender(){let tabs=[['overview','داشبورد'],['reservations','رزروها'],['orders','سفارش‌ها'],['products','محصولات'],['days','تقویم'],['support','پشتیبانی'],['receipts','رسیدها'],['settings','تنظیمات']];$('#app').innerHTML=head()+`<div class="admin"><aside class="side">${tabs.map(t=>`<button class="${S.tab===t[0]?'active':''}" onclick="S.tab='${t[0]}';adminRender()">${t[1]}</button>`).join('')}<button onclick="dashboard()">بازگشت</button></aside><section class="adminmain"><div class="title"><h2>پنل مدیریت حرفه‌ای</h2><button class="btn small" onclick="adminLoad().then(adminRender)">↻ بروزرسانی</button></div>${adminContent()}</section></div>`}
async function log(action,target,details){await sb.from('admin_logs').insert({admin_id:S.session.user.id,action,target_type:'web',target_id:String(target),details})}function csv(rows,name){let x='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'text/csv;charset=utf-8'}));a.download=name;a.click()}function csvRes(){csv([['date','customer','amount','status'],...S.reservations.map(x=>[x.reservation_date,x.customer_name,x.amount,x.status])],'reservations.csv')}function csvOrd(){csv([['product','customer','amount','status'],...S.orders.map(x=>[x.product_name,x.customer_name,x.amount,x.status])],'orders.csv')}
async function boot(){let r=await sb.auth.getSession();S.session=r.data.session;await publicData();if(S.session)await userData();home()}sb.auth.onAuthStateChange((_e,s)=>{S.session=s});boot();
</script></body></html>
